        update-types: [minor, patch]

  # ── Frontend samples ────────────────────────────────────
  - package-ecosystem: npm
    directory: /app-react-vite
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      types:
        patterns: ["@types/*"]
        update-types: [minor, patch]

  # ── Azure Upload (SWA) ──────────────────────────────────
  - package-ecosystem: npm
    directory: /azure-upload-file-to-storage/api
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      azure-sdk:
        patterns: ["@azure/*"]
        update-types: [minor, patch]
      eslint-tooling:
        patterns: ["eslint", "eslint-*", "typescript-eslint", "prettier"]
        update-types: [minor, patch]
      types:
        patterns: ["@types/*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /azure-upload-file-to-storage/app
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      eslint-tooling:
        patterns: ["eslint", "eslint-*", "typescript-eslint", "globals", "prettier"]
        update-types: [minor, patch]
      types:
        patterns: ["@types/*"]
        update-types: [minor, patch]


version: 2
updates:
  # ── GitHub Actions ──────────────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      gh-actions:
        patterns: ["*"]

  # ── Root ────────────────────────────────────────────────
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      azure-sdk:
        patterns: ["@azure/*", "azure-*"]
        update-types: [minor, patch]

  # ── API samples ─────────────────────────────────────────
  - package-ecosystem: npm
    directory: /api-expressjs-vm
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      types:
        patterns: ["@types/*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /api-functions-v4-azure-resource-management
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      azure-sdk:
        patterns: ["@azure/*", "azure-*"]
        update-types: [minor, patch]
      types:
        patterns: ["@types/*"]
        update-types: [minor, patch]
      eslint-tooling:
        patterns: ["eslint", "eslint-*", "@typescript-eslint/*"]
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /api-inmemory
    schedule:
      interval: weekly
      day: monday
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      azure-sdk:
